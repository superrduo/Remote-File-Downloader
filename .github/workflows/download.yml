name: Remote File Downloader

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Download file
        run: |
          mkdir -p /tmp/downloads
          cd /tmp/downloads

          # PASTE YOUR DOWNLOAD URL HERE
          URL='https://demo.filestash.app/api/files/cat?path=%2FMy%20Pack%2FGabbie%20Carter%20-%20Gaping%20Gabbie%E2%80%99s%20Ass.mp4&name=Gabbie%20Carter%20-%20Gaping%20Gabbie%E2%80%99s%20Ass.mp4'

          echo "Starting download..."

          curl -L \
            --fail \
            --show-error \
            --progress-bar \
            --retry 3 \
            --connect-timeout 30 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -o downloaded_file \
            "$URL"

          echo "Download completed!"
          ls -lh downloaded_file
