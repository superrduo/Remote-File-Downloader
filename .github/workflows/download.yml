name: Remote File Downloader

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Download file
        run: |
          mkdir -p /tmp/downloads
          cd /tmp/downloads

          # Your URL is correctly formatted now
          URL='https://nexus-080.indi.tb-cdn.pw/dld/3f9ce7ef-0f91-4d47-88a2-286b3e8465d8?token=c6359f15-f4b9-44d1-87f9-52d873607704&filename=489155.com%40DANDY-931-LTX.mp4'

          echo "Starting download..."

          # Removed --progress-bar so curl displays the detailed speed meter
          curl -L \
            --fail \
            --show-error \
            --retry 3 \
            --connect-timeout 30 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -o downloaded_file \
            "$URL"

          echo "Download completed!"

          ls -lh downloaded_file
